spring.application.name=LegalFlow

# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# === Database Driver ===
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${LEGALFLOW_DB_USERNAME:legalflow}
spring.datasource.password=${LEGALFLOW_DB_PASSWORD}

# === Risikoschwellen ===
risk.thresholds.medium=30
risk.thresholds.high=60

# === Risikoregeln ===
risk.rules.high-contract-value.threshold=100000
risk.rules.high-contract-value.points=30

risk.rules.auto-renewal.points=10

risk.rules.long-term-contract.years=3
risk.rules.long-term-contract.points=15

risk.rules.foreign-governing-law.eu-points=10
risk.rules.foreign-governing-law.non-eu-points=20

risk.rules.unlimited-liability.points=25